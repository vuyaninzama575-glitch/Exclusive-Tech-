  <style>
    body {

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background: #000;
      position: sticky;
      top: 0;
    }

    .header a {
      color: white;
      text-decoration: none;
      margin-left: 10px;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 20px;
      background: linear-gradient(#0b1220, #111a2e);
    }

    .hero h1 {
      margin: 0;
    }

    /* FILTERS */
    .filters {
      text-align: center;
      padding: 10px;
    }

    .filters button {
      margin: 5px;
      padding: 8px 12px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      background: #e5e7eb;
    }

    .active {
      background: #00d4ff !important;
      color: black;
    }

    /* PRODUCTS */
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
    }

    .card {
      width: 220px;
      margin: 10px;
      background: #111a2e;
      border-radius: 10px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .pad {
      padding: 10px;
    }

    .price {
      color: #00d4ff;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      background: #00d4ff;
      color: black;
      cursor: pointer;
      border-radius: 5px;
    }

    /* CART */
    .cart {
      position: sticky;
      bottom: 0;
      background: #000;
      padding: 10px;
      border-top: 1px solid #333;
    }
  </style>
</head>
